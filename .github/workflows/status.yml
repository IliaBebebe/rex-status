name: Check and publish status
on:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: rex-status-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Read last home heartbeat
        shell: bash
        run: |
          if git fetch --depth=1 origin pulse; then
            git show FETCH_HEAD:heartbeat.json > /tmp/rex-heartbeat.json
          else
            printf '{}' > /tmp/rex-heartbeat.json
          fi
      - name: Test status semantics
        run: python3 -m unittest discover -s tests
      - name: Check public sites and build
        run: python3 build.py --heartbeat /tmp/rex-heartbeat.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Enforce HTTPS when the custom certificate is ready
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if curl --fail --silent --max-time 12 https://status.rexcorp.space/ -o /tmp/rex-status-https.html; then
            gh api repos/IliaBebebe/rex-status/pages --method PUT -F https_enforced=true
            echo 'Custom-domain HTTPS verified and enforced'
          else
            echo 'Custom-domain certificate is still provisioning; retry on the next scheduled publication'
          fi
